version: '3.8'

services:
  # ============================================
  # Основной бот (Aiogram)
  # ============================================
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psycho_bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=postgresql://botuser:botpassword@postgres:5432/psychobot
      - REDIS_URL=redis://redis:6379/0
      - MODEL_PATH=/models/YandexGPT-5-Lite-8B-instruct-Q4_K_M.gguf
    volumes:
      - model_volume:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot_network
    healthcheck:
      test: ["CMD", "python", "-c", "import bot.config; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # PostgreSQL (основная БД)
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: psycho_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=botuser
      - POSTGRES_PASSWORD=botpassword
      - POSTGRES_DB=psychobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d psychobot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Redis (кэш, сессии, очереди)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: psycho_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - bot_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ============================================
# Volumes (постоянное хранение данных)
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  model_volume:
    driver: local

# ============================================
# Networks (изоляция сети)
# ============================================
networks:
  bot_network:
    driver: bridge
